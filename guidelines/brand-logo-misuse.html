<!-- @dsCard group="Brand" viewport="900x420" name="Logo misuse" subtitle="Ten real mistakes, shown. Use the shipped file as it is" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--ink-50);font-family:var(--font-body);color:var(--ink-800);padding:20px}.k{font:600 .68rem var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:#5a574f}</style><style>.g{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}figure{margin:0}.t{height:110px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff;border-radius:10px;position:relative}.t img{height:34px;max-width:92%;object-fit:contain}
figcaption{font-size:.74rem;line-height:1.35;margin-top:6px}figcaption b{color:#9a1818}</style></head><body><div class="g">
<figure><div class="t" style=""><img src="../assets/logo/horizontal-ink.png" style="height:62px;width:70%;max-width:none;object-fit:fill"></div><figcaption><b>Don't stretch</b> or squash it.</figcaption></figure>
<figure><div class="t" style=""><img src="../assets/logo/horizontal-ink.png" style="transform:rotate(-12deg)"></div><figcaption><b>Don't rotate</b> it.</figcaption></figure>
<figure><div class="t" style=""><img src="../assets/logo/horizontal-ink.png" style="filter:drop-shadow(4px 4px 3px rgba(0,0,0,.6))"></div><figcaption><b>Don't add</b> a shadow, glow or outline.</figcaption></figure>
<figure><div class="t" style=""><img src="../assets/logo/horizontal-ember.png" style="filter:hue-rotate(160deg)"></div><figcaption><b>Don't recolor</b> it outside the shipped set.</figcaption></figure>
<figure><div class="t" style="background:url(../assets/photo/hands-raised-in-the-rows.jpg) center/cover"><img src="../assets/logo/mark-ember.png" style="height:60px"></div><figcaption><b>Never the red mark</b> on a photo. Use white.</figcaption></figure>
<figure><div class="t" style="background:#2a2824"><img src="../assets/logo/horizontal-ink.png"></div><figcaption><b>Don't use ink on dark.</b> Pick by the ground.</figcaption></figure>
<figure><div class="t" style=""><img src="../assets/logo/horizontal-ink.png" style="height:34px"><span style="position:absolute;left:58px;top:22px;font:800 20px var(--font-display)">Sunday</span></div><figcaption><b>Don't crowd it.</b> Keep X clear on every side.</figcaption></figure>
<figure><div class="t" style=""><img src="../assets/logo/mark-ink.png" style="height:34px"><span style="font:400 24px Georgia,serif;margin-left:8px">Journey Church</span></div><figcaption><b>Don't retype</b> the name. Use the file.</figcaption></figure>
<figure><div class="t" style="background:linear-gradient(90deg,#ff3a3a,#2a2824)"><img src="../assets/logo/horizontal-white.png"></div><figcaption><b>No gradients</b> behind it, ever.</figcaption></figure>
<figure><div class="t" style=""><img src="../assets/logo/horizontal-ink.png" style="height:8px"></div><figcaption><b>Never below</b> the minimum size.</figcaption></figure>
</div></body></html>
