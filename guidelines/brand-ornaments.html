<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--ink-50);font-family:var(--font-body);padding:18px 20px}.hex{font-family:var(--font-mono);font-size:.68rem;color:var(--ink-400);margin:0}.nm{font-family:var(--font-display);font-weight:700;font-size:.78rem;letter-spacing:-.01em;margin:0}.cell{display:flex;align-items:center;justify-content:center;padding:18px;min-height:86px}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px 20px;align-items:center">
<div><p class="t-eyebrow text-ember ember-dot" style="margin:0">Ember dot</p></div>
<div><p class="t-eyebrow text-ember" style="margin:0">Hairline <span class="eyebrow-line" style="margin-left:.6rem"></span></p></div>
<div><span class="display" style="font-size:1.1rem"><span class="ember-underline">Ember underline</span></span></div>
<div><a href="#" class="arrow" style="font-size:.9rem;font-weight:600;text-decoration:none">Typographic arrow</a></div>
<div><span class="num" style="font-size:1.6rem">01</span> <span class="hex">red numeral</span></div>
<div style="display:flex;gap:8px"><span class="grain" style="display:block;width:52px;height:34px;background:#0a0a0a"></span><span class="tooth" style="display:block;width:52px;height:34px;background:#ece7df"></span><span class="hex">grain · tooth</span></div>
</div></body></html>
