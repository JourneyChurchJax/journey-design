<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--ink-50);font-family:var(--font-body);padding:18px 20px}.g{display:grid;gap:10px}.lb{font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--ink-400);margin:0}.hex{font-family:var(--font-mono);font-size:.68rem;color:var(--ink-400);margin:0}.nm{font-family:var(--font-display);font-weight:700;font-size:.82rem;letter-spacing:-.01em;margin:0}.sw{display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:64px}</style></head><body>
<div class="g" style="grid-template-columns:repeat(4,1fr)">
<div class="sw"><i style="background:#f7f4f0;border:1px solid #d8d1c5"></i><p class="nm">Cream</p><p class="hex">--ink-50 · #f7f4f0</p></div>
<div class="sw"><i style="background:#ece7df"></i><p class="nm">Alternate</p><p class="hex">--ink-100 · #ece7df</p></div>
<div class="sw"><i style="background:#0a0a0a"></i><p class="nm">Ink</p><p class="hex">--ink-800 · #0a0a0a</p></div>
<div class="sw"><i style="background:#050505"></i><p class="nm">Deep</p><p class="hex">--ink-900 · #050505</p></div>
</div></body></html>
