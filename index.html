<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Journey Church — Brand</title><link rel="stylesheet" href="styles.css">
<style>*{box-sizing:border-box}html,body{margin:0;background:#f7f4f0;color:#0a0a0a;font-family:'Inter',sans-serif}a{color:#0a0a0a}a:hover{color:#ff3a3a}
header{padding:56px clamp(20px,5vw,72px) 40px;border-bottom:1px solid #d8d1c5;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:24px}
header h1{margin:0;font:800 clamp(44px,7vw,96px)/.92 'Inter Tight',sans-serif;letter-spacing:-.03em}header h1 span{color:#ff3a3a}
header p{margin:0;max-width:440px;font-size:17px;line-height:1.5;color:#5a574f;text-wrap:pretty}
.wrap{display:grid;grid-template-columns:260px minmax(0,1fr)}
nav{position:sticky;top:0;align-self:start;height:100vh;overflow:auto;padding:28px 20px 40px clamp(20px,3vw,40px);border-right:1px solid #d8d1c5;display:flex;flex-direction:column;gap:2px}
nav input{margin-bottom:18px;padding:10px 12px;border:1px solid #d8d1c5;border-radius:6px;background:#fff;font:15px 'Inter',sans-serif}
nav a{text-decoration:none;font-size:14px;padding:6px 8px;border-radius:4px;color:#2a2824}nav a:hover{background:#ece7df;color:#0a0a0a}
nav b{font:600 11px/1 'Inter Tight',sans-serif;letter-spacing:.2em;color:#9a948a;margin:18px 8px 6px}
main{padding:24px clamp(20px,4vw,56px) 120px;min-width:0}
section{padding-top:40px}section h2{margin:0 0 22px;font:700 28px/1.1 'Inter Tight',sans-serif;letter-spacing:-.01em;display:flex;align-items:baseline;gap:12px}section h2 small{font:500 14px 'Inter';color:#9a948a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px}
.card{display:flex;flex-direction:column;gap:10px;min-width:0}
.pv{position:relative;overflow:hidden;background:#fff;border:1px solid #d8d1c5;border-radius:8px;max-height:460px}
.pv iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;pointer-events:none}
.pv a{position:absolute;inset:0}
.meta{display:flex;justify-content:space-between;gap:12px;align-items:baseline}.meta h3{margin:0;font:600 16px/1.3 'Inter Tight',sans-serif}.meta a{font-size:13px;white-space:nowrap;color:#9a1818}
.card p{margin:0;font-size:13px;line-height:1.45;color:#5a574f;text-wrap:pretty}
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px}
.dl a{display:flex;flex-direction:column;gap:8px;text-decoration:none;font-size:12px;color:#2a2824;word-break:break-all}
.dl img{width:100%;aspect-ratio:1;object-fit:contain;background:repeating-conic-gradient(#ece7df 0 25%,#f7f4f0 0 50%) 0 0/16px 16px;border:1px solid #d8d1c5;border-radius:6px}
@media(max-width:820px){.wrap{grid-template-columns:1fr}nav{position:static;height:auto;border-right:0;border-bottom:1px solid #d8d1c5;flex-direction:row;flex-wrap:wrap}nav b,nav input{width:100%}}</style></head><body>

const rank=g=>{const i=ORDER.indexOf(g);if(i>=0)return i*2;const b=ORDER.indexOf(g.split(' · ')[0]);return b>=0?b*2+1:99};
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const groups=[...new Set(CARDS.map(c=>c.g))].sort((a,b)=>rank(a)-rank(b)||a.localeCompare(b));
const nav=document.getElementById('nav'),main=document.getElementById('main');let last='';
groups.forEach(g=>{const top=g.split(' · ')[0];const sub=g.includes(' · ');if(sub&&top!==last){nav.insertAdjacentHTML('beforeend','<b>'+esc(top.toUpperCase())+'</b>')}last=sub?top:'';
nav.insertAdjacentHTML('beforeend','<a href="#'+slug(g)+'">'+esc(sub?g.split(' · ')[1]:g)+'</a>');
const cs=CARDS.filter(c=>c.g===g);
main.insertAdjacentHTML('beforeend','<section id="'+slug(g)+'" data-g><h2>'+esc(g)+' <small>'+cs.length+'</small></h2><div class="grid">'+cs.map(c=>{const[w,h]=c.v.split('x').map(Number);return '<div class="card" data-t="'+esc((c.n+' '+c.s+' '+g).toLowerCase())+'"><div class="pv" data-w="'+w+'" data-h="'+h+'"><iframe loading="lazy" tabindex="-1" src="'+esc(c.p)+'" width="'+w+'" height="'+h+'" title="'+esc(c.n)+'"></iframe><a href="'+esc(c.p)+'" target="_blank" aria-label="Open '+esc(c.n)+'"></a></div><div class="meta"><h3>'+esc(c.n)+'</h3><a href="'+esc(c.p)+'" target="_blank">Open ↗</a></div>'+(c.s?'<p>'+esc(c.s)+'</p>':'')+'</div>'}).join('')+'</div></section>')});
nav.insertAdjacentHTML('beforeend','<b>FILES</b><a href="#downloads">Downloads</a>');
const byF={};EXPORTS.forEach(p=>{const f=p.includes('/')?p.split('/').slice(0,-1).join(' / '):'General';(byF[f]=byF[f]||[]).push(p)});
main.insertAdjacentHTML('beforeend','<section id="downloads"><h2>Downloads <small>'+EXPORTS.length+'</small></h2>'+Object.keys(byF).map(f=>'<h3 style="font:600 13px/1 Inter Tight,sans-serif;letter-spacing:.18em;color:#5a574f;margin:28px 0 14px">'+esc(f.toUpperCase())+'</h3><div class="dl">'+byF[f].map(p=>'<a href="exports/'+esc(p)+'" download><img loading="lazy" src="exports/'+esc(p)+'" alt="">'+esc(p.split('/').pop())+'</a>').join('')+'</div>').join('')+'</section>');
const fit=()=>document.querySelectorAll('.pv').forEach(el=>{const w=+el.dataset.w,h=+el.dataset.h,k=el.clientWidth/w;el.style.height=Math.min(h*k,460)+'px';el.firstChild.style.transform='scale('+k+')'});
new ResizeObserver(fit).observe(main);fit();
document.getElementById('q').addEventListener('input',e=>{const q=e.target.value.toLowerCase().trim();document.querySelectorAll('.card').forEach(c=>c.style.display=!q||c.dataset.t.includes(q)?'':'none');document.querySelectorAll('section[data-g]').forEach(s=>s.style.display=[...s.querySelectorAll('.card')].some(c=>c.style.display!=='none')?'':'none')});
</script></body></html>
