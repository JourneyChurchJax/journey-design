<!-- @dsCard group="Ministry · Discipleship Groups" viewport="1920x1080" name="Logo lockup" subtitle="Red circle J + DISCIPLESHIP over GROUPS in Schibsted Grotesk 900, on ink, cream and red" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@700;900&display=swap">
<style>
/* Discipleship Groups lockup (Adam, 20 Nov 2026).
   The J is the real heavy mark from assets/logo, never redrawn: white J in a red circle on ink and cream,
   ink J in a white circle on red. DISCIPLESHIP is tracked 0.15em so it runs the same width as GROUPS
   (DISCIPLESHIP size = 0.468 x GROUPS size). Circle = 1.21 x GROUPS size; J inside = 68% of the circle. */
html,body{margin:0}
.dg-band{width:1920px;height:360px;display:flex;align-items:center;justify-content:center}
.dg{display:flex;align-items:center;gap:25.6px;font-family:'Schibsted Grotesk',var(--font-display),sans-serif}
.dg-c{width:176px;height:176px;border-radius:50%;background:#FF3A3A;display:flex;align-items:center;justify-content:center;flex:none}
.dg-c img{width:120px;height:120px;object-fit:contain}
.dg-w{display:flex;flex-direction:column;gap:8.1px}
.dg-1{font-weight:900;font-size:67.9px;line-height:1;letter-spacing:.15em;margin-right:-.15em;white-space:nowrap}
.dg-2{font-weight:900;font-size:145px;line-height:.84;color:#FF3A3A;white-space:nowrap}
.on-ink{background:#1E1D1B}.on-ink .dg-1{color:#fff}
.on-cream{background:#F7F4F0}.on-cream .dg-1{color:#0A0A0A}
.on-red{background:#FF3A3A}.on-red .dg-c{background:#fff}.on-red .dg-1{color:#0A0A0A}.on-red .dg-2{color:#fff}
</style></head><body>
<div class="dg-band on-ink"><div class="dg"><div class="dg-c"><img src="../../assets/logo/mark-white-heavy.png" alt="Journey Church J mark"></div><div class="dg-w"><div class="dg-1">DISCIPLESHIP</div><div class="dg-2">GROUPS</div></div></div></div>
<div class="dg-band on-cream"><div class="dg"><div class="dg-c"><img src="../../assets/logo/mark-white-heavy.png" alt="Journey Church J mark"></div><div class="dg-w"><div class="dg-1">DISCIPLESHIP</div><div class="dg-2">GROUPS</div></div></div></div>
<div class="dg-band on-red"><div class="dg"><div class="dg-c"><img src="../../assets/logo/mark-ink-heavy.png" alt="Journey Church J mark"></div><div class="dg-w"><div class="dg-1">DISCIPLESHIP</div><div class="dg-2">GROUPS</div></div></div></div>
</body></html>
