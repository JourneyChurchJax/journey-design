<!doctype html><html><head><meta charset="utf-8"><title>Good Living — background options</title><link rel="stylesheet" href="../../styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@600;700;800&amp;display=swap" rel="stylesheet">
<script src="../../assets/js/frames.js"></script><script src="graphic.js?v=11"></script>
<style>html,body{margin:0;background:#1c1b19;color:#f7f4f0;font-family:'Figtree',sans-serif}a{color:#86c24f}a:hover{color:#f8efe2}
.wrap{max-width:1500px;margin:0 auto;padding:24px 32px 64px;display:flex;flex-direction:column;gap:48px}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.42fr);gap:24px;align-items:start}
.glh{display:flex;align-items:center;flex-wrap:wrap;gap:14px;margin:0 0 14px}.glh b{background:#f8efe2;color:#22482a;border-radius:4px;padding:3px 9px;font-size:14px}.glh span{font-size:20px;font-weight:700;width:auto;white-space:nowrap}.glh em{font-style:normal;opacity:.7;font-size:15px}
.fr{border-radius:6px;overflow:hidden}</style></head><body><div class="wrap">
<section><p class="glh"><b>0</b><span>Current — Cream</span><em>for reference</em></p><div class="row"><div class="fr" style="--w:1920;--h:1080"><div class="art" style="padding:0" data-assets="../../assets" data-t="cream" data-f="wide"></div></div><div class="fr" style="--w:1080;--h:1920"><div class="art" style="padding:0" data-assets="../../assets" data-t="cream" data-f="tall"></div></div></div></section>
<section><p class="glh"><b>A</b><span>Gingham</span><em>picnic tablecloth frame, cream card inside</em></p><div class="row"><div class="fr" style="--w:1920;--h:1080"><div class="art" style="padding:0" data-assets="../../assets" data-t="gingham" data-f="wide"></div></div><div class="fr" style="--w:1080;--h:1920"><div class="art" style="padding:0" data-assets="../../assets" data-t="gingham" data-f="tall"></div></div></div></section>
<section><p class="glh"><b>B</b><span>Orchard Green</span><em>deep green, cream type, oversized ghost apple</em></p><div class="row"><div class="fr" style="--w:1920;--h:1080"><div class="art" style="padding:0" data-assets="../../assets" data-t="green" data-f="wide"></div></div><div class="fr" style="--w:1080;--h:1920"><div class="art" style="padding:0" data-assets="../../assets" data-t="green" data-f="tall"></div></div></div></section>
<section><p class="glh"><b>C</b><span>Kraft Paper</span><em>grocery-bag brown with speckled fiber</em></p><div class="row"><div class="fr" style="--w:1920;--h:1080"><div class="art" style="padding:0" data-assets="../../assets" data-t="kraft" data-f="wide"></div></div><div class="fr" style="--w:1080;--h:1920"><div class="art" style="padding:0" data-assets="../../assets" data-t="kraft" data-f="tall"></div></div></div></section>
</div><script>document.querySelectorAll('.art[data-t]').forEach(a=>buildGL(a,a.dataset.f,'oct17',a.dataset.t));</script></body></html>
